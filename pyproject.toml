[project]
name = "mailroom"
version = "0.1.0"
description = "Command-line tool for the Kettlebird Tea Steep Club newsletter"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic[email]>=2.14.4",
    "resend>=2.55.0",
]

[project.scripts]
mailroom = "mailroom.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
